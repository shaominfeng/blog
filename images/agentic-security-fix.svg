<svg width="100%" viewBox="0 0 680 180" role="img" xmlns="http://www.w3.org/2000/svg" class="f">
<title>安全漏洞 CAS-4303 从晨报告警到 PR 的全闭环</title>
<desc>晨报自动捞出 Fortify Critical 漏洞，/debug 分析根因，我 review 确认，/dev-init 新建开发单 #4303，AI 修复（凭证挪到 secret），/dev-complete 提 PR。蓝为 AI 主导，绿为我主导，琥珀为晨报自动捞出。</desc>
<style>
.f{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
text{font-size:12px}
.t1{fill:#1d1d1b}.t2{fill:#6b6b6b}.t3{fill:#9b9b9b}
.b-blue{fill:#e6f1fb;stroke:#3b82f6}.x-blue{fill:#0c447c}
.b-teal{fill:#dcf5f1;stroke:#0d9488}.x-teal{fill:#115e59}
.b-amber{fill:#fdeeda;stroke:#d97706}.x-amber{fill:#92400e}
.ar{stroke:#9b9b9b;fill:none}
@media (prefers-color-scheme:dark){
.t1{fill:#f5f5f4}.t2{fill:#a8a29e}.t3{fill:#78716c}
.b-blue{fill:#0c447c;stroke:#60a5fa}.x-blue{fill:#dbeafe}
.b-teal{fill:#134e4a;stroke:#5eead4}.x-teal{fill:#ccfbf1}
.b-amber{fill:#7c2d12;stroke:#fbbf24}.x-amber{fill:#fde68a}
.ar{stroke:#a8a29e}
}
</style>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="context-stroke"></path></marker>
</defs>
<text class="t1" x="30" y="50" text-anchor="start">安全漏洞:从晨报告警到 PR 的全闭环</text>
<rect class="b-amber" x="40" y="64" width="92" height="46" rx="6"></rect>
<text class="x-amber" x="86" y="84" text-anchor="middle">晨报捞出</text>
<text class="x-amber" x="86" y="99" text-anchor="middle">Critical 漏洞</text>
<rect class="b-blue" x="146" y="64" width="84" height="46" rx="6"></rect>
<text class="x-blue" x="188" y="84" text-anchor="middle">/debug</text>
<text class="x-blue" x="188" y="99" text-anchor="middle">分析根因</text>
<rect class="b-teal" x="244" y="64" width="84" height="46" rx="6"></rect>
<text class="x-teal" x="286" y="84" text-anchor="middle">我 review</text>
<text class="x-teal" x="286" y="99" text-anchor="middle">确认根因</text>
<rect class="b-blue" x="342" y="64" width="84" height="46" rx="6"></rect>
<text class="x-blue" x="384" y="84" text-anchor="middle">/dev-init</text>
<text class="x-blue" x="384" y="99" text-anchor="middle">建开发单 #4303</text>
<rect class="b-blue" x="440" y="64" width="84" height="46" rx="6"></rect>
<text class="x-blue" x="482" y="84" text-anchor="middle">AI 修复</text>
<text class="x-blue" x="482" y="99" text-anchor="middle">凭证→secret</text>
<rect class="b-teal" x="538" y="64" width="92" height="46" rx="6"></rect>
<text class="x-teal" x="584" y="84" text-anchor="middle">/dev-complete</text>
<text class="x-teal" x="584" y="99" text-anchor="middle">提 PR ✓</text>
<text class="t3" x="86" y="125" text-anchor="middle">09:00</text>
<text class="t3" x="188" y="125" text-anchor="middle">15:30</text>
<text class="t3" x="286" y="125" text-anchor="middle">15:45</text>
<text class="t3" x="384" y="125" text-anchor="middle">15:50</text>
<text class="t3" x="482" y="125" text-anchor="middle">16:00</text>
<text class="t3" x="584" y="125" text-anchor="middle">16:15</text>
<line class="ar" x1="132" y1="87" x2="146" y2="87" marker-end="url(#a)"></line>
<line class="ar" x1="230" y1="87" x2="244" y2="87" marker-end="url(#a)"></line>
<line class="ar" x1="328" y1="87" x2="342" y2="87" marker-end="url(#a)"></line>
<line class="ar" x1="426" y1="87" x2="440" y2="87" marker-end="url(#a)"></line>
<line class="ar" x1="524" y1="87" x2="538" y2="87" marker-end="url(#a)"></line>
<text class="t2" x="30" y="155" text-anchor="start">琥珀 = 晨报自动捞出 · 蓝 = AI 主导 · 绿 = 我主导(只做 review 这个判断动作)</text>
<text class="t2" x="30" y="170" text-anchor="start">我的角色:从执行者退成审核者 —— 不从零理解漏洞,只判断结论对不对</text>
</svg>
